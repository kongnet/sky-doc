  <script>

    // 示例数据
    const exampleData = `《精通API架构：设计、运维与演进》

├── 第三部分：API运维与安全
│   ├── 7. 部署与发布
│   │   ├── 容器化与Kubernetes基础
│   │   ├── 发布策略：功能开关、特性标记
│   │   ├── 流量切换：蓝绿部署、金丝雀发布（与流量管理结合）
│   │   └── 部署与发布解耦
│   ├── 8. 安全
│   │   ├── 威胁建模（STRIDE模型）
│   │   ├── 认证与授权：OAuth2、JWT、TLS/mTLS
│   │   ├── API密钥管理
│   │   └── 安全审计与合规
│   └── 9. 可观测性
│       ├── 日志
│       ├── 指标（Metrics）：Prometheus
│       ├── 分布式追踪：Jaeger、Zipkin
│       └── 健康检查与SLO
└── 第四部分：架构演进
    ├── 10. 从遗留系统到API驱动
    │   ├── 评估现有架构
    │   ├── 定义演进目标
    │   ├── 绞杀者模式深入实践
    │   └── 数据拆分与同步
    ├── 11. 演进到云平台
    │   ├── 云原生原则
    │   ├── 使用API基础设施平滑迁移
    │   └── 混合云/多云策略
    └── 12. 架构决策记录（ADR）
        ├── 为什么要记录架构决策
        ├── ADR模板示例
        └── 案例：会议系统演进中的关键决策`;

    function parseInput(text) {
      if (!text.trim()) return null;
      const lines = text.split('\n').filter(line => line.trim());
      
      const hasTreeSymbols = lines.some(l => /[│├└]/.test(l));
      const hasPathFormat = lines[0].startsWith('/') || 
                           (lines.length > 0 && lines.some(l => l.includes('/') && !hasTreeSymbols));
      
      if (hasPathFormat && !hasTreeSymbols) {
        return parsePathFormat(lines);
      } else if (hasTreeSymbols) {
        return parseTreeFormat(lines);
      } else {
        return parseIndentFormat(lines);
      }
    }

    function parseTreeFormat(lines) {
      const root = { data: { text: lines[0].replace(/^[├└│─\s]+/, '').trim() }, children: [] };
      const stack = [{ node: root, level: -1 }];

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];
        const level = (line.match(/[│├└]/g) || []).length;
        const text = line.replace(/^[│├└─\s]+/, '').trim();
        
        if (!text) continue;
        const node = { data: { text: text }, children: [] };
        while (stack.length > 1 && stack[stack.length - 1].level >= level) {
          stack.pop();
        }
        stack[stack.length - 1].node.children.push(node);
        stack.push({ node, level });
      }
      return root;
    }

    function parseIndentFormat(lines) {
      let indentUnit = 2;
      const indents = [];
      
      for (let i = 1; i < lines.length; i++) {
        const match = lines[i].match(/^(\s*)/);
        if (match && match[1].length > 0) indents.push(match[1].length);
      }
      
      if (indents.length > 0) {
        const minIndent = Math.min(...indents);
        if (minIndent >= 4 && indents.some(i => i % 4 === 0)) indentUnit = 4;
        else if (minIndent >= 2 && indents.some(i => i % 2 === 0)) indentUnit = 2;
      }

      const root = { data: { text: lines[0].trim() }, children: [] };
      const stack = [{ node: root, level: -1 }];

      for (let i = 1; i < lines.length; i++) {
        const line = lines[i];
        const match = line.match(/^(\s*)/);
        const leadingSpaces = match ? match[1].length : 0;
        const text = line.trim();
        
        if (!text) continue;
        const level = Math.floor(leadingSpaces / indentUnit);
        const node = { data: { text: text }, children: [] };
        while (stack.length > 1 && stack[stack.length - 1].level >= level) {
          stack.pop();
        }
        stack[stack.length - 1].node.children.push(node);
        stack.push({ node, level });
      }
      return root;
    }

    function parsePathFormat(lines) {
      const root = { data: { text: 'Root' }, children: [] };
      lines.forEach(line => {
        const parts = line.replace(/^\//, '').split('/').filter(p => p);
        let current = root;
        parts.forEach(part => {
          let child = current.children.find(c => c.data.text === part);
          if (!child) {
            child = { data: { text: part }, children: [] };
            current.children.push(child);
          }
          current = child;
        });
      });
      return root.children.length === 1 ? root.children[0] : root;
    }

    // Pre-process data to set expandState before import
    function preprocessExpandState(data, maxLevel) {
      let nodeCount = 0;
      
      function traverse(node, level) {
        nodeCount++;
        if (node.children) {
          node.children.forEach(child => {
            // Set expandState: expand if below maxLevel, collapse otherwise
            if (child.data) {
              child.data.expandState = level < maxLevel ? 'expand' : 'collapse';
            }
            traverse(child, level + 1);
          });
        }
      }
      
      traverse(data, 0);
      return nodeCount;
    }

    // Limit nodes for performance - truncate deep nodes when count is high
    function limitNodes(data, maxTotalNodes = 300, maxDepth = 4) {
      let count = 0;
      let truncated = false;
      
      function traverse(node, depth) {
        count++;
        if (count > maxTotalNodes) {
          truncated = true;
          return false;
        }
        
        if (depth >= maxDepth && node.children && node.children.length > 0) {
          // Truncate deep nodes
          const childCount = node.children.length;
          node.children = [{
            data: { 
              text: `... (${childCount} more)`,
              expandState: 'collapse'
            },
            children: []
          }];
          count++;
          return true;
        }
        
        if (node.children) {
          for (let i = node.children.length - 1; i >= 0; i--) {
            if (!traverse(node.children[i], depth + 1)) {
              node.children.splice(i, 1);
            }
          }
        }
        return true;
      }
      
      traverse(data, 0);
      return { count, truncated };
    }

    // Get optimal settings based on node count
    function getOptimalSettings(nodeCount) {
      if (nodeCount > 2500) {
        return {
          disableAnimation: true,
          expandLevel: 1,
          useCompactTheme: true,
          useFiletreeLayout: true,
          limitNodes: true
        };
      } else if (nodeCount > 1500) {
        return {
          disableAnimation: true,
          expandLevel: 1,
          useCompactTheme: false,
          useFiletreeLayout: false,
          limitNodes: false
        };
      } else if (nodeCount > 500) {
        return {
          disableAnimation: true,
          expandLevel: 2,
          useCompactTheme: false,
          useFiletreeLayout: false,
          limitNodes: false
        };
      }
      return {
        disableAnimation: false,
        expandLevel: 2,
        useCompactTheme: false,
        useFiletreeLayout: false,
        limitNodes: false
      };
    }

    function generateMindmap() {
      const text = document.getElementById('input-text').value;
      const data = parseInput(text);

      if (!data) {
        showModal('请输入有效的目录结构', '错误');
        return;
      }

      document.getElementById('empty-state').style.display = 'none';

      const container = document.getElementById('minder-container');
      container.innerHTML = '';

      // Check if KityMinder is loaded
      if (typeof window.kityminder === 'undefined') {
        console.error('KityMinder library not loaded');
        showModal('KityMinder 库加载失败，请检查网络连接', '错误');
        return;
      }

      // Get selected layout and theme
      const layout = document.getElementById('layout-select').value;
      const theme = document.getElementById('theme-select').value;

      try {
        // Count nodes first
        let nodeCount = 0;
        function countNodes(node) {
          nodeCount++;
          if (node.children) {
            node.children.forEach(countNodes);
          }
        }
        countNodes(data);
        console.log('Total nodes:', nodeCount);

        // Get optimal settings based on node count
        const settings = getOptimalSettings(nodeCount);
        
        // Limit nodes for very large datasets
        if (settings.limitNodes) {
          const result = limitNodes(data, 3000, 6);
          nodeCount = result.count;
          if (result.truncated) {
            console.log('Data truncated for performance. Showing', nodeCount, 'nodes');
          }
        }

        // Pre-process expand state
        preprocessExpandState(data, settings.expandLevel);

        // Create KityMinder instance
        minder = new window.kityminder.Minder({
          renderTo: container
        });

        // Disable animation for large datasets
        if (settings.disableAnimation) {
          minder.disableAnimation();

      if (minder) {
        const zoom = minder.getZoomValue() || 1;
        minder.setZoomValue(zoom * 1.2);
      }
    }

      if (minder) {
        const zoom = minder.getZoomValue() || 1;
        minder.setZoomValue(zoom * 0.8);
      }
    }

    function resetView() {
      if (minder) {
        minder.setZoomValue(1);
        minder.camera.center();
      }

    function toggleSidebar() {
      const sidebar = document.querySelector('.left-panel');
      const toggleBtn = document.querySelector('.sidebar-toggle');
      
      sidebar.classList.toggle('collapsed');
      
      // 切换按钮图标
      if (sidebar.classList.contains('collapsed')) {
        toggleBtn.innerHTML = '▶';
        toggleBtn.title = '展开侧边栏';
      } else {
        toggleBtn.innerHTML = '◀';
        toggleBtn.title = '收起侧边栏';
      }
    }

      // Quick node counter - stops at limit to avoid freezing
    function quickCountNodes(root, limit = 3000) {
      let count = 0;
      const stack = [root];
      while (stack.length > 0 && count < limit) {
        const node = stack.pop();
        count++;
        const children = node.getChildren ? node.getChildren() : [];
        for (let i = children.length - 1; i >= 0; i--) {
          stack.push(children[i]);
        }
      }
      return { count, hasMore: count >= limit };
    }

    function expandToLevel(targetLevel) {
      if (!minder) {
        showModal('请先生成脑图', '提示');
        return;
      }
      
      const root = minder.getRoot();
      if (!root) return;
      
      // Quick count to check total nodes (limit 3000 for performance)
      const { count: totalNodes, hasMore } = quickCountNodes(root, 3000);
      console.log('Total nodes:', hasMore ? '3000+' : totalNodes);
      
      // For large datasets (>2500 nodes), only allow level 1 (but level 0 means "all", check separately)
      if (totalNodes > 2500 && targetLevel > 1 && targetLevel !== 0) {
        console.warn('Large dataset detected, limiting to level 1');
        targetLevel = 1;
      }
      
      // If "expand all" is requested but there are too many nodes (>3000), limit to level 2
      if (targetLevel === 0 && hasMore) {
        console.warn('Too many nodes (>3000) for "expand all", limiting to level 2');
        targetLevel = 2;
      }
      
      // Disable animation for large datasets (>800 nodes)
      if (totalNodes > 800) {
        minder.disableAnimation();
      }
      
      // Simple iterative expand - process nodes level by level
      let processed = 0;
      
      function processLevel(levelNodes, currentLevel) {
        // targetLevel === 0 means "expand all", so we never collapse based on currentLevel
        if (targetLevel !== 0 && currentLevel >= targetLevel) {
          // Collapse all nodes at this level
          levelNodes.forEach(node => {
            if (node.getChildren && node.getChildren().length > 0) {
              try { node.collapse(); } catch(e) {}
            }
          });
          return;
        }
        
        // Expand nodes at this level
        const nextLevelNodes = [];
        levelNodes.forEach(node => {
          const children = node.getChildren ? node.getChildren() : [];
          if (children.length > 0) {
            try { 
              node.expand();
              processed++;
            } catch(e) {}
            nextLevelNodes.push(...children);
          }
        });
        
        // Process next level
        if (nextLevelNodes.length > 0) {
          processLevel(nextLevelNodes, currentLevel + 1);
        }
      }
      
      // Start from root children (level 1)
      const rootChildren = root.getChildren ? root.getChildren() : [];
      if (rootChildren.length > 0) {
        processLevel(rootChildren, 1);
      }
      
      minder.refresh();
      if (totalNodes <= 800) {
        minder.enableAnimation();
      }
      
      console.log('Expanded to level:', targetLevel, 'Processed:', processed, 'nodes');
    }

    function exportImage() {
      if (minder) {
        minder.exportData('png').then(function(data) {
          const link = document.createElement('a');
          link.download = 'mindmap.png';
          link.href = data;
          link.click();
        });
      }
    }

    function clearInput() {
      document.getElementById('input-text').value = '';
      document.getElementById('minder-container').innerHTML = '';
      document.getElementById('empty-state').style.display = 'flex';
      minder = null;
    }

    function loadExample() {
      document.getElementById('input-text').value = exampleData;
      generateMindmap();
    }

    document.getElementById('generate-btn').addEventListener('click', generateMindmap);
    document.getElementById('clear-btn').addEventListener('click', clearInput);
    document.getElementById('example-btn').addEventListener('click', loadExample);
    document.getElementById('layout-select').addEventListener('change', function() {
      if (document.getElementById('input-text').value.trim()) {
        generateMindmap();
      }
    });
    // 主题网格选择事件
    document.querySelectorAll('.theme-option').forEach(option => {
      option.addEventListener('click', function() {
        const selectedTheme = this.dataset.value;
        
        // 移除其他选项的active状态
        document.querySelectorAll('.theme-option').forEach(opt => {
          opt.classList.remove('active');
        });
        // 添加当前选项的active状态
        this.classList.add('active');
        
        // 如果minder存在，更新主题而不重新生成
        if (minder) {
          updateTheme(selectedTheme);
        } else {
          // 仅更新隐藏input，下次生成时应用
          document.getElementById('theme-select').value = selectedTheme;
        }
      });
    });

  <div id="customModal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-title">提示</div>
      <div class="modal-message" id="modalMessage"></div>
      <button class="modal-close" onclick="closeModal()">确定</button>
    </div>
  </div>

  <script>
    // 显示模态框
    function showModal(message, title = '提示') {
      const modal = document.getElementById('customModal');
      const modalTitle = modal.querySelector('.modal-title');
      const modalMessage = document.getElementById('modalMessage');
      
      modalTitle.textContent = title;
      modalMessage.textContent = message;
      modal.classList.add('active');
    }
    
    // 关闭模态框
    function closeModal(event) {
      // 如果点击的是关闭按钮或遮罩层，则关闭
      if (!event || event.target === document.getElementById('customModal') || event.target.classList.contains('modal-close')) {
        document.getElementById('customModal').classList.remove('active');
      }
    }
  </script>
